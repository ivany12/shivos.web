<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Morfi: sistema de gestión gastronómica. Salón, pedidos, cocina, caja, stock, tienda online.">
<title>Morfi · Gestión gastronómica</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#e4572e;--r:14px;--font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
[data-theme=light]{--bg:#f4f3ef;--bg2:#ffffff;--bg3:#f0eee9;--line:#e4e1da;--tx:#1d1c1a;--mut:#77726a;--ok:#1f9d55;--bad:#d64545;--warn:#c97a07;--shadow:0 1px 2px rgba(20,16,8,.06),0 4px 16px rgba(20,16,8,.05);--side:#ffffff}
[data-theme=dark]{--bg:#111110;--bg2:#1b1a18;--bg3:#242320;--line:#32302c;--tx:#f2efe9;--mut:#9a948a;--ok:#3ccf7a;--bad:#ff6b5e;--warn:#f0a43a;--shadow:0 1px 2px rgba(0,0,0,.4);--side:#151513}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 0 10px;font-weight:700}
h4{margin:14px 0 8px;font-size:14px}
.muted{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.r{text-align:right}.c{text-align:center}.pad{padding:12px}.hide{display:none!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:1.15em}
.nota{color:var(--warn)}
/* botones */
.btn{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:color-mix(in srgb,var(--tx) 25%,var(--line))}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}.danger-t{color:var(--bad)!important}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:9px}.btn.big{font-size:17px;padding:14px 26px;min-height:52px}
.btn.wide{grid-column:span 2}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--bg3);color:var(--mut)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge{margin-left:auto;background:var(--bg3);color:var(--tx);border-radius:999px;padding:0 7px;font-size:12px;font-weight:700;min-width:20px;text-align:center}
.badge.hot{background:var(--bad);color:#fff}
.seg{display:inline-flex;background:var(--bg3);border-radius:11px;padding:3px;gap:2px;margin:4px 0 14px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:var(--shadow)}
.seg.sm button{padding:6px 10px;font-size:13px}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;flex:none}.av.lg{width:44px;height:44px;font-size:18px}
.dot{width:14px;height:14px;border-radius:5px;background:var(--acc);display:inline-block;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent)}
.brand{display:flex;align-items:center;gap:12px}.brand b{display:block;font-weight:800;letter-spacing:-.01em;line-height:1.2}.brand small{color:var(--mut);font-size:12px}
.brand.big b{font-size:24px}.brand.big .dot{width:20px;height:20px;border-radius:7px}
/* layout */
#app{height:100%;display:flex}
.side{width:228px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;padding-top:max(16px,env(safe-area-inset-top))}
.side .brand{padding:4px 8px 18px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--mut);font-weight:600;font-size:14px}
.nav a:hover{background:var(--bg3);color:var(--tx)}
.nav a.on{background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--tx)}.nav a.on svg{color:var(--acc)}
.me{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:left;margin-top:10px}
.me b{display:block;font-size:14px}.me small{color:var(--mut);font-size:12px}
.main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;min-width:0}
.page{padding:24px 28px 40px;max-width:1400px}.page.narrow,.narrow{max-width:820px}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar.tight{align-items:center;margin-bottom:10px}.bar p{margin:2px 0 0}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.quick.c{justify-content:center}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.click{cursor:pointer}.card.click:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.card h3{margin-top:0}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid-cards .card{display:flex;flex-direction:column;gap:4px;margin:0}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:36px 16px;color:var(--mut);text-align:center}.empty b{color:var(--tx);font-size:16px}
.hero-card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:36px;text-align:center;box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;color:var(--mut);font-size:13px;flex-wrap:wrap}.lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.lg.free{background:var(--bg2)}.lg.busy{background:color-mix(in srgb,var(--acc) 30%,var(--bg2))}.lg.bill{background:color-mix(in srgb,var(--warn) 40%,var(--bg2))}.lg.res{background:color-mix(in srgb,#3a86ff 25%,var(--bg2))}
/* login / landing */
.login{min-height:100%;width:100%;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:520px}.login-box .brand{justify-content:center;margin-bottom:24px}
.login-box.gate{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.user{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;cursor:pointer;font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow)}
.user small{color:var(--mut);font-weight:500;font-size:12px}.user small i{font-style:normal}.user.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.pinpad{margin-top:22px;text-align:center}.pinpad .seg{margin:0 auto 10px}
.dots{height:44px;display:flex;align-items:center;justify-content:center;gap:12px}.dotp{width:14px;height:14px;border-radius:50%;background:var(--acc)}.dots .hint{color:var(--mut)}
.dots.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:6px auto 0}
.keys button{height:62px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);font-size:22px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.keys button:active{background:var(--acc);color:#fff}
.landing{width:100%;overflow:auto}.l-top{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;max-width:1150px;margin:0 auto}
.l-hero{text-align:center;padding:60px 24px 40px;max-width:820px;margin:0 auto}.l-hero h1{font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.035em;margin:0 0 18px;font-weight:800}
.l-hero p{font-size:18px;color:var(--mut);margin:0 auto 28px;max-width:640px}
.l-feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;max-width:1150px;margin:0 auto;padding:10px 24px 40px}.l-feat .card{display:flex;flex-direction:column;gap:6px}
.l-foot{text-align:center;padding:30px}
/* salón */
.zona{margin-bottom:8px}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.mesa{aspect-ratio:1.2;border-radius:16px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow);padding:6px}
.mesa b{font-size:22px;font-weight:800}.mesa small{color:var(--mut);font-size:12px;text-align:center}.mesa strong{font-size:15px}
.mesa.busy{background:color-mix(in srgb,var(--acc) 14%,var(--bg2));border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.mesa.bill{background:color-mix(in srgb,var(--warn) 18%,var(--bg2));border-color:var(--warn)}
.mesa.res{background:color-mix(in srgb,#3a86ff 10%,var(--bg2));border-color:color-mix(in srgb,#3a86ff 50%,var(--line))}
/* pedidos */
.cols{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg3);border-radius:var(--r);padding:10px;min-height:220px}
.col h3{margin:4px 4px 10px;display:flex;justify-content:space-between}
.col .card{margin-bottom:8px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.card .t{font-weight:700}.card .t.late{color:var(--bad)}.card .act{display:flex;justify-content:flex-end;margin-top:6px;gap:6px;flex-wrap:wrap}
.inbox{margin-bottom:14px}.inbox h3{color:var(--bad)}.card.in{border-color:var(--bad);display:flex;flex-direction:column;gap:6px}
/* pedido */
.order{display:grid;grid-template-columns:1fr 410px;height:100%}
.carta{overflow:auto;padding:18px 20px;min-width:0}
.carta .bar h2{font-size:20px}
.search{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:left;cursor:pointer;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.prod img{width:calc(100% + 24px);margin:-12px -12px 4px;height:84px;object-fit:cover}
.prod b{font-weight:600;line-height:1.25}.prod span{color:var(--mut);font-weight:600;font-size:14px}
.prod:active{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--bg2))}
.prod.out{opacity:.55}.prod em{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;background:var(--bad);color:#fff;border-radius:6px;padding:1px 6px}
.ticket{display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--line);min-height:0;overflow:hidden}
.tk-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}.tk-head b{font-size:17px}.tk-head .pill{align-self:flex-start}
.items{flex:1;overflow:auto}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:9px 14px}.it.sent{background:color-mix(in srgb,var(--bg3) 50%,transparent)}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-size:17px;font-weight:600}
.qty b{min-width:18px;text-align:center}
.it-n{cursor:pointer;font-weight:600;line-height:1.3}.it-n small{display:block;font-weight:400;color:var(--mut);font-size:13px}.it-n .nota{color:var(--warn)}
.it-p{text-align:right;font-weight:600;white-space:nowrap}.it-p small{display:block;color:var(--ok);font-weight:500;font-size:11px}
.tot{padding:12px 18px;border-top:1px solid var(--line)}.tot .row{padding:2px 0}.tot .big{font-size:22px;font-weight:800}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 16px}
.mob-toggle{display:none}
.qtyrow{margin:10px 0}
/* cocina */
.kitchen .seg{margin:0}
.prodsum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.prodsum span{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}.prodsum b{color:var(--acc)}
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.kc{background:var(--bg2);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.kc.warn{border-color:var(--warn)}.kc.late{border-color:var(--bad)}
.kh{display:flex;justify-content:space-between;padding:12px 14px;background:var(--bg3);font-size:17px}.kc.late .kh span{color:var(--bad);font-weight:800}
.kmeta{padding:6px 14px 0;color:var(--mut);font-size:12px}
.ki{padding:4px 14px}.kit{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px;cursor:pointer}
.kit small{display:block;color:var(--mut);font-size:14px}.kit .nota,.kit.nota{color:var(--warn)}
.kit.done{text-decoration:line-through;opacity:.4}
.kc .btn{margin:10px 12px 12px}
.done-list{display:flex;gap:8px;flex-wrap:wrap}
/* tablas y kpis */
.tbl-wrap{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:auto;margin-bottom:14px;box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tbl td.r,.tbl th.r{text-align:right}
.tbl.plain td{padding:7px 4px}
.tbl.click tr[data-o],.tbl.click tr[data-p],.tbl.click tr[data-u],.tbl.click tr[data-c],.tbl.click tr[data-i],.tbl.click tr[data-g],.tbl.click tr[data-go]{cursor:pointer}.tbl.click tr:hover td{background:var(--bg3)}
.tbl tr.anul td{opacity:.5}.lowrow td{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}.kpi small{color:var(--mut);font-weight:500}.kpi b{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 100px 40px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb i{height:10px;background:var(--bg3);border-radius:6px;display:block}.hb i b{display:block;height:100%;background:var(--acc);border-radius:6px;min-width:2px}.hb strong{text-align:right;font-weight:600}.hb em{color:var(--mut);font-style:normal;text-align:right}
.vbars{display:flex;gap:4px;height:160px;align-items:flex-end}.vbars.sm{height:110px}
.vbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;min-width:0}
.vbars i{display:block;background:var(--acc);border-radius:5px 5px 0 0;min-height:2px}.vbars small{color:var(--mut);font-size:10px;white-space:nowrap;overflow:hidden}
.result .row{padding:6px 0;border-bottom:1px dashed var(--line)}
input[type=date],input[type=time],input[type=datetime-local]{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;color-scheme:light dark}
.res-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card.res{display:flex;flex-direction:column;gap:3px;margin:0;cursor:pointer}.rh{display:flex;justify-content:space-between;align-items:center}.rh b{font-size:22px;font-weight:800}
.card.res.cancelada,.card.res.novino,.card.res.sentada{opacity:.55}.card.res.confirmada{border-left:4px solid var(--ok)}.card.res.pendiente{border-left:4px solid var(--warn)}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:12px 0}.qrbox img{border-radius:12px;background:#fff;padding:6px}.qrbox input{width:100%;margin:6px 0;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:8px}.qrbox>div{flex:1;min-width:220px}
.colors{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}.sw{width:34px;height:34px;border-radius:10px;border:2px solid var(--bg2);box-shadow:0 0 0 1px var(--line);cursor:pointer}.sw.on{box-shadow:0 0 0 3px var(--tx)}
.colors input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--bg2)}
.rec,.optrow{padding:5px 0;border-bottom:1px dashed var(--line)}.optrow input{flex:1}
.ticket-preview{background:#fff;color:#000;font:12px/1.3 'Courier New',monospace;padding:12px;border-radius:8px;max-height:50vh;overflow:auto}.ticket-preview h1{font-size:16px;text-align:center;margin:0}.ticket-preview hr{border:0;border-top:1px dashed #000}
/* modal y formularios */
.modal-bg{position:fixed;inset:0;background:rgba(10,8,4,.45);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:50;padding:16px;animation:fi .12s}
@keyframes fi{from{opacity:0}}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal.wide{max-width:760px}
.modal>h3{color:var(--tx);text-transform:none;letter-spacing:-.01em;font-size:20px;margin:0 0 14px;font-weight:800}
.modal h4 em{color:var(--warn);font-style:normal;font-size:12px;margin-left:6px}
.form label{display:block;margin-bottom:12px;color:var(--mut);font-size:13px;font-weight:500}
.form input,.form select,.form textarea,.row select,.row input:not([type=checkbox]){display:block;width:100%;margin-top:4px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px}
.row select,.row input:not([type=checkbox]){margin-top:0;font-size:15px;padding:9px 10px}
.form input:focus,.form select:focus,.form textarea:focus,.search:focus,.row input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.form label.half{display:inline-block;width:calc(50% - 6px);vertical-align:top}.form label.half+label.half{margin-left:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.grid2 .full,.grid2>.btns{grid-column:1/-1}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:500}.opt small{color:var(--mut)}
.opt.on{background:var(--acc);color:#fff;border-color:var(--acc)}.opt.on small{color:#fff}
.checks{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:10px}
.ck{display:flex!important;align-items:center;gap:9px;color:var(--tx)!important;font-size:15px!important;margin:6px 0!important;cursor:pointer}
.ck input{width:20px!important;height:20px;margin:0!important;accent-color:var(--acc);flex:none}
.ck.big{font-size:16px!important;margin:12px 0!important}
.pay-total{background:var(--bg3);border-radius:14px;padding:12px 16px;margin-bottom:12px}.pay-total .big{font-size:28px;font-weight:800}
.split{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.medios{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.payrow{margin:6px 0}.payrow input{width:140px!important;text-align:right;font-size:18px!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:99;transition:opacity .3s;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}.toast.out{opacity:0}
.pcat h3{margin-top:18px}
/* tablet y celular */
@media (max-width:1100px){.order{grid-template-columns:1fr 360px}.side{width:72px;padding:12px 8px}.side .brand div,.nav a span,.me span:last-child{display:none}.side .brand{justify-content:center;padding:4px 0 14px}.nav a{justify-content:center;position:relative}.nav a .badge{position:absolute;top:2px;right:2px;margin:0;font-size:10px;min-width:16px;padding:0 4px}.me{justify-content:center}}
@media (max-width:760px){
  #app{flex-direction:column-reverse}
  .side{width:100%;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);align-items:center}
  .side .brand{display:none}.nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
  .nav a{flex-direction:column;gap:2px;padding:6px 10px;font-size:11px;min-width:64px}.nav a span{display:block!important;white-space:nowrap}
  .me{margin:0;padding:6px;border:0}
  .page{padding:16px 14px 30px}h2{font-size:21px}
  .order{grid-template-columns:1fr}.order .ticket{display:none;border:0}.order.show-ticket .carta{display:none}.order.show-ticket .ticket{display:flex}
  .carta,.ticket{padding-bottom:80px}.carta{padding:14px}
  .mob-toggle{display:block;position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--acc);color:#fff;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .cols{grid-template-columns:repeat(4,86vw);scroll-snap-type:x mandatory}.col{scroll-snap-align:start}
  .two{grid-template-columns:1fr}.hb{grid-template-columns:80px 1fr 82px 34px;font-size:13px}
  .prods{grid-template-columns:repeat(2,1fr)}
  .mesas{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
  .hide-m{display:none}.grid2{grid-template-columns:1fr}.form label.half{width:100%;margin-left:0!important}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .modal-bg{align-items:end;padding:0}.modal{border-radius:20px 20px 0 0;max-height:94vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
}
@media print{.side,.mob-toggle{display:none}}
</style>

<div id="app"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="v-servicio.js"></script>
<script src="v-gestion.js"></script>
<script src="v-admin.js"></script>
<script src="v-gente.js"></script>
<script src="templates.js"></script>
<script src="seed.js"></script>
<script>
  // Demo local (sin cuenta) o nube (Firebase)
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.has('demo')) { localStorage.setItem('morfi_mode', 'demo'); history.replaceState(null, '', location.pathname); }
    if (q.has('cuenta')) localStorage.removeItem('morfi_mode');
    if (localStorage.getItem('morfi_mode') === 'demo' || !window.FIREBASE_CONFIG) { window.DEMO = true; window.startApp('demo'); }
    else { var s = document.createElement('script'); s.type = 'module'; s.src = 'cloud.js'; document.body.appendChild(s); }
  })();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
</script>
