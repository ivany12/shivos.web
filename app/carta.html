<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Carta</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#e4572e;--bg:#f6f5f1;--bg2:#fff;--line:#e6e3dc;--tx:#1d1c1a;--mut:#77726a;--ok:#1f9d55;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--bg2:#1b1a18;--line:#32302c;--tx:#f2efe9;--mut:#9a948a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
header{padding:28px 0 8px}
header h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
header h1 i{width:18px;height:18px;border-radius:6px;background:var(--acc);display:inline-block;box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 20%,transparent)}
header p{margin:6px 0 0;color:var(--mut)}
.msg{background:color-mix(in srgb,var(--acc) 12%,var(--bg2));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:14px;padding:12px 14px;margin:14px 0}
.chips{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 15px;white-space:nowrap;font-weight:600;cursor:pointer}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:26px 0 10px;scroll-margin-top:70px}
.p{display:flex;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;align-items:center}
.p:active{border-color:var(--acc)}
.p div{flex:1;min-width:0}.p b{display:block;font-weight:700}.p small{display:block;color:var(--mut);margin:3px 0 6px;line-height:1.35}.p strong{font-weight:700}
.p img{width:88px;height:88px;border-radius:12px;object-fit:cover;flex:none}
.p .add{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:22px;flex:none;font-weight:600}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:736px;margin:0 auto;background:var(--acc);color:#fff;border:0;border-radius:16px;padding:16px 18px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.2);cursor:pointer}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg2);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:21px;font-weight:800}
.grp h4{margin:16px 0 8px;font-size:14px}.grp h4 em{font-style:normal;color:var(--acc);font-size:12px;margin-left:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px 13px;cursor:pointer}.opt.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label{display:block;margin:12px 0 0;font-size:13px;color:var(--mut);font-weight:500}
input,select,textarea{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:1px solid var(--line);background:var(--bg2);border-radius:13px;padding:13px 18px;font-weight:700;cursor:pointer;min-height:48px}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);width:100%;margin-top:18px;font-size:16px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-size:18px;cursor:pointer}
.it{padding:10px 0;border-bottom:1px solid var(--line)}.it small{display:block;color:var(--mut)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-top:6px}.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--mut)}.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.status{text-align:center;padding:50px 10px}.status .big{font-size:56px}.status h2{margin:10px 0}
.steps{display:flex;justify-content:center;gap:6px;margin:20px 0}.steps i{width:46px;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--acc)}
.muted{color:var(--mut)}.tot{font-size:20px;font-weight:800}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:40px}
</style>
</head>
<body>
<div id="app" class="wrap"><p class="muted" style="padding:40px 0">Cargando carta…</p></div>
<script src="config.js"></script>
<script type="module">
const q = new URLSearchParams(location.search);
const R = q.get('r'), MESA = (q.get('mesa') || '').toUpperCase();
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const money = n => '$ ' + Math.round(n || 0).toLocaleString('es-AR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1600); };
let M = null, cart = [], send, watch;
try { cart = JSON.parse(sessionStorage.getItem('cart_' + (R || 'demo')) || '[]'); } catch { }
const saveCart = () => { try { sessionStorage.setItem('cart_' + (R || 'demo'), JSON.stringify(cart)); } catch { } };

/* ── conexión: nube (r=local) o demo (mismo navegador) ── */
if (R && window.FIREBASE_CONFIG) {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const { getFirestore, doc, getDoc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const db = getFirestore(initializeApp(window.FIREBASE_CONFIG));
  try { const s = await getDoc(doc(db, 'tenants', R, 'public', 'menu')); M = s.exists() ? s.data() : null; } catch (e) { console.error(e); }
  send = async o => { await setDoc(doc(db, 'tenants', R, 'inbox', o.id), o); };
  watch = (id, cb) => onSnapshot(doc(db, 'tenants', R, 'inbox', id), s => s.exists() && cb(s.data()));
} else {
  const read = c => { try { return JSON.parse(localStorage.getItem('morfidb_' + c) || '{}'); } catch { return {}; } };
  M = read('public').menu || null;
  let ch = null; try { ch = new BroadcastChannel('morfi'); } catch { }
  send = async o => { const m = read('inbox'); m[o.id] = o; localStorage.setItem('morfidb_inbox', JSON.stringify(m)); ch && ch.postMessage('inbox'); };
  watch = (id, cb) => { const f = () => { const x = read('inbox')[id]; x && cb(x); }; f(); addEventListener('storage', f); ch && (ch.onmessage = f); setInterval(f, 3000); };
}
if (!M) { app.innerHTML = '<div class="status"><div class="big">🍽️</div><h2>Carta no disponible</h2><p class="muted">Este local todavía no publicó su carta.</p></div>'; throw 0; }
document.documentElement.style.setProperty('--acc', M.color || '#e4572e');
document.title = M.local + ' · Carta';
const T = M.tienda || {};
const modsById = Object.fromEntries((M.mods || []).map(m => [m.id, m]));
const itemPrice = it => (it.p + it.mods.reduce((a, m) => a + m.p, 0)) * it.q;
const total = () => cart.reduce((a, it) => a + itemPrice(it), 0);

const pending = sessionStorage.getItem('order_' + (R || 'demo'));
if (pending) showStatus(pending); else menu();

function menu() {
  const canOrder = T.activa && (T.retiro || T.delivery || (T.mesa && MESA));
  app.innerHTML = `<header><h1><i></i>${esc(M.local)}</h1><p>${esc(M.dir || '')}${M.tel ? ' · ' + esc(M.tel) : ''}</p></header>
    ${MESA ? `<div class="msg">Estás en la <b>mesa ${esc(MESA)}</b>. Pedí desde acá y te lo llevamos.</div>` : ''}
    ${T.mensaje ? `<div class="msg">${esc(T.mensaje)}</div>` : ''}${!canOrder ? '<div class="msg">Ahora no estamos tomando pedidos online. Podés ver la carta.</div>' : ''}
    <nav class="chips">${M.cats.map((c, i) => `<button class="chip ${i ? '' : 'on'}" data-c="${c.id}">${esc(c.name)}</button>`).join('')}</nav>
    ${M.cats.map(c => `<h2 id="c-${c.id}">${esc(c.name)}</h2>${M.prods.filter(p => p.cat === c.id).map(p => `<div class="p" data-p="${p.id}"><div><b>${esc(p.name)}</b>${p.desc ? `<small>${esc(p.desc)}</small>` : ''}<strong>${money(p.price)}</strong></div>${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : ''}${canOrder ? '<span class="add">+</span>' : ''}</div>`).join('')}`).join('')}
    <p class="foot">Pedidos online con Morfi</p>
    ${cart.length ? `<button class="cartbar" id="cb"><span>Ver pedido · ${cart.reduce((a, i) => a + i.q, 0)}</span><span>${money(total())}</span></button>` : ''}`;
  $$('[data-c]').forEach(b => b.onclick = () => { $$('[data-c]').forEach(x => x.classList.toggle('on', x === b)); $('#c-' + b.dataset.c).scrollIntoView({ behavior: 'smooth' }); });
  if (canOrder) $$('[data-p]').forEach(d => d.onclick = () => pick(M.prods.find(p => p.id === d.dataset.p)));
  $('#cb') && ($('#cb').onclick = checkout);
}
function sheet(html, mount) {
  const w = document.createElement('div'); w.className = 'bg'; w.innerHTML = `<div class="sheet">${html}</div>`;
  w.onclick = e => { if (e.target === w || e.target.closest('[data-close]')) w.remove(); };
  document.body.appendChild(w); mount && mount(w.firstElementChild, () => w.remove());
}
function pick(p) {
  const groups = (p.mods || []).map(id => modsById[id]).filter(Boolean);
  let qty = 1;
  sheet(`<h3>${esc(p.name)}</h3><p class="muted">${esc(p.desc || '')}</p>
    ${groups.map(g => `<div class="grp" data-g="${g.id}"><h4>${esc(g.name)}${g.min ? '<em>obligatorio</em>' : ''}</h4><div class="opts">${g.opts.map(o => `<button class="opt" data-n="${esc(o.n)}" data-p="${o.p}">${esc(o.n)}${o.p ? ' +' + money(o.p) : ''}</button>`).join('')}</div></div>`).join('')}
    <label>Aclaración<input id="nota" placeholder="Ej: sin cebolla"></label>
    <div class="row" style="margin-top:16px"><span>Cantidad</span><div class="qty"><button id="m">−</button><b id="v">1</b><button id="pl">+</button></div></div>
    <button class="btn pri" id="ok">Agregar · ${money(p.price)}</button>`, (s, close) => {
    const upd = () => { const ex = $$('.opt.on', s).reduce((a, b) => a + +b.dataset.p, 0); $('#ok', s).textContent = 'Agregar · ' + money((p.price + ex) * qty); };
    $$('.grp', s).forEach(gEl => { const g = modsById[gEl.dataset.g]; $$('.opt', gEl).forEach(b => b.onclick = () => { if (g.max === 1) $$('.opt', gEl).forEach(x => x !== b && x.classList.remove('on')); else if (!b.classList.contains('on') && $$('.opt.on', gEl).length >= (g.max || 99)) return; b.classList.toggle('on'); upd(); }); });
    $('#m', s).onclick = () => { qty = Math.max(1, qty - 1); $('#v', s).textContent = qty; upd(); };
    $('#pl', s).onclick = () => { qty++; $('#v', s).textContent = qty; upd(); };
    $('#ok', s).onclick = () => {
      const mods = []; let bad = null;
      $$('.grp', s).forEach(gEl => { const g = modsById[gEl.dataset.g]; const on = $$('.opt.on', gEl); if (on.length < (g.min || 0)) bad = g.name; on.forEach(b => mods.push({ g: g.id, n: b.dataset.n, p: +b.dataset.p })); });
      if (bad) return toast('Elegí ' + bad.toLowerCase());
      cart.push({ pid: p.id, n: p.name, p: p.price, q: qty, mods, nota: $('#nota', s).value.trim() }); saveCart(); close(); toast('Agregado'); menu();
    };
  });
}
function checkout() {
  const tipos = [MESA && T.mesa ? ['mesa', 'En la mesa'] : null, T.retiro ? ['retiro', 'Retiro'] : null, T.delivery ? ['delivery', 'Delivery'] : null].filter(Boolean);
  let tipo = tipos[0][0];
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('morfi_cliente') || '{}'); } catch { }
  sheet(`<h3>Tu pedido</h3><div id="items"></div>
    <div class="seg" id="tipo">${tipos.map(([k, l]) => `<button data-t="${k}" class="${k === tipo ? 'on' : ''}">${l}</button>`).join('')}</div>
    <label>Nombre<input id="nom" value="${esc(saved.nombre || '')}" autocomplete="name"></label>
    <div id="extra"></div>
    <label>¿Cómo pagás?<select id="pago"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta / QR al recibir</option></select></label>
    <label>Comentarios<textarea id="nt" rows="2" placeholder="Timbre, sin servilletas, etc."></textarea></label>
    <div class="row" style="margin-top:16px"><span>Total</span><span class="tot" id="tt"></span></div>
    <button class="btn pri" id="go">Enviar pedido</button><button class="btn" data-close style="width:100%;margin-top:8px">Seguir mirando</button>`, (s, close) => {
    const drawItems = () => {
      $('#items', s).innerHTML = cart.map((it, i) => `<div class="it row"><div><b>${esc(it.n)}</b>${it.mods.map(m => `<small>+ ${esc(m.n)}</small>`).join('')}${it.nota ? `<small>«${esc(it.nota)}»</small>` : ''}</div><div class="qty"><button data-i="${i}" data-d="-1">−</button><b>${it.q}</b><button data-i="${i}" data-d="1">+</button></div><b>${money(itemPrice(it))}</b></div>`).join('');
      $$('[data-i]', s).forEach(b => b.onclick = () => { const it = cart[+b.dataset.i]; it.q += +b.dataset.d; if (it.q <= 0) cart.splice(+b.dataset.i, 1); saveCart(); if (!cart.length) { close(); menu(); } else { drawItems(); drawTot(); } });
    };
    const env = () => tipo === 'delivery' && $('#zona', s) ? (M.envios || [])[+$('#zona', s).value]?.precio || 0 : 0;
    const drawTot = () => { $('#tt', s).textContent = money(total() + env()); };
    const drawExtra = () => {
      $('#extra', s).innerHTML = tipo === 'mesa' ? `<p class="muted">Mesa ${esc(MESA)}</p>` : `<label>Teléfono<input id="tel" type="tel" value="${esc(saved.tel || '')}" autocomplete="tel"></label>` + (tipo === 'delivery' ? `<label>Dirección<input id="dir" value="${esc(saved.dir || '')}" autocomplete="street-address"></label>${(M.envios || []).length ? `<label>Zona de envío<select id="zona">${M.envios.map((e, i) => `<option value="${i}">${esc(e.zona)} · ${money(e.precio)}</option>`).join('')}</select></label>` : ''}${T.minimo ? `<p class="muted">Pedido mínimo para delivery: ${money(T.minimo)}</p>` : ''}` : '');
      $('#zona', s) && ($('#zona', s).onchange = drawTot); drawTot();
    };
    $$('[data-t]', s).forEach(b => b.onclick = () => { tipo = b.dataset.t; $$('[data-t]', s).forEach(x => x.classList.toggle('on', x === b)); drawExtra(); });
    $('#pago', s).onchange = e => { if (e.target.value === 'Transferencia' && T.alias) toast('Alias: ' + T.alias); };
    drawItems(); drawExtra();
    $('#go', s).onclick = async () => {
      const nombre = $('#nom', s).value.trim(), tel = $('#tel', s)?.value.trim() || '', dir = $('#dir', s)?.value.trim() || '';
      if (!nombre) return toast('Poné tu nombre');
      if (tipo !== 'mesa' && tel.replace(/\D/g, '').length < 8) return toast('Poné un teléfono válido');
      if (tipo === 'delivery' && !dir) return toast('Poné la dirección');
      if (tipo === 'delivery' && T.minimo && total() < T.minimo) return toast('El mínimo es ' + money(T.minimo));
      localStorage.setItem('morfi_cliente', JSON.stringify({ nombre, tel, dir }));
      const zona = tipo === 'delivery' && $('#zona', s) ? M.envios[+$('#zona', s).value].zona : null;
      const o = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 10), estado: 'nuevo', tipo, mesa: tipo === 'mesa' ? MESA : '', zona, cliente: { nombre, tel, dir }, items: cart.map(i => ({ pid: i.pid, n: i.n, p: i.p, q: i.q, mods: i.mods, nota: i.nota })), total: total() + env(), pago: $('#pago', s).value, nota: $('#nt', s).value.trim(), t: Date.now() };
      $('#go', s).disabled = true; $('#go', s).textContent = 'Enviando…';
      try { await send(o); } catch (e) { $('#go', s).disabled = false; $('#go', s).textContent = 'Enviar pedido'; return toast('No se pudo enviar. Probá de nuevo.'); }
      cart = []; saveCart(); sessionStorage.setItem('order_' + (R || 'demo'), o.id); close(); showStatus(o.id);
    };
  });
}
function showStatus(id) {
  const ST = { nuevo: ['⏳', 'Esperando confirmación', 'El local está viendo tu pedido.', 1], cocina: ['👨‍🍳', '¡Confirmado! En preparación', 'Ya lo estamos preparando.', 2], listo: ['✅', '¡Está listo!', 'Ya podés retirarlo.', 3], camino: ['🛵', 'En camino', 'Tu pedido salió.', 3], entregado: ['🎉', '¡Entregado!', 'Gracias por tu pedido.', 4], rechazado: ['😕', 'No pudimos tomar tu pedido', '', 0] };
  app.innerHTML = '<div class="status"><p class="muted">Cargando…</p></div>';
  watch(id, o => {
    const [ic, t, d, n] = ST[o.estado] || ST.nuevo;
    app.innerHTML = `<div class="status"><div class="big">${ic}</div><h2>${t}</h2><p class="muted">${esc(o.motivo || (o.estado === 'listo' && o.tipo === 'delivery' ? 'Sale en unos minutos.' : o.estado === 'listo' && o.tipo === 'mesa' ? 'Te lo llevamos a la mesa.' : d))}</p>
      ${n ? `<div class="steps">${[1, 2, 3, 4].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>` : ''}
      <p><b>${esc(M.local)}</b>${M.tel ? ' · ' + esc(M.tel) : ''}</p><p class="muted">${o.items.map(i => i.q + '× ' + esc(i.n)).join(' · ')} — ${money(o.total)}</p>
      ${o.pago === 'Transferencia' && T.alias ? `<p>Alias para transferir: <b>${esc(T.alias)}</b></p>` : ''}
      ${['entregado', 'rechazado'].includes(o.estado) || o.tipo === 'mesa' ? '<button class="btn" id="nuevo">Hacer otro pedido</button>' : ''}</div>`;
    $('#nuevo') && ($('#nuevo').onclick = () => { sessionStorage.removeItem('order_' + (R || 'demo')); menu(); });
  });
}
</script>
</body>
</html>
